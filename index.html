<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>WigTry</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0c1424;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #e0e6ef;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 16px 20px;
        }

        .container { max-width: 420px; width: 100%; }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* Общие элементы */
        .btn-primary {
            background: linear-gradient(135deg, #1e3550, #1a4058);
            color: #e8eff5;
            border: 1px solid rgba(180, 160, 120, 0.25);
            padding: 16px 34px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: all 0.25s;
            width: 100%;
            max-width: 280px;
        }
        .btn-primary:active { background: #1a4058; border-color: #c9b07d; transform: scale(0.96); }
        
        .btn-secondary {
            background: transparent;
            color: #7a8ea3;
            border: 1px solid rgba(120, 140, 160, 0.3);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-secondary:active { background: rgba(255,255,255,0.04); border-color: #8aa0b8; }

        .section-header { text-align: center; margin: 24px 0 8px; }
        .section-title { font-size: 20px; font-weight: 600; color: #d5dde8; letter-spacing: -0.2px; }
        .section-hint { font-size: 13px; color: #6b7d94; margin-top: 4px; }

        .nav-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

        /* Экран 1: Миссия */
        .mission-screen { text-align: center; padding-top: 60px; }
        .mission-text { font-size: 18px; color: #c9ccd4; line-height: 1.8; font-style: italic; margin-bottom: 16px; padding: 0 8px; }
        .mission-sub { font-size: 13px; color: #6b7d94; line-height: 1.6; margin-bottom: 36px; padding: 0 8px; }

        /* Экран 2: Приветствие */
        .welcome-screen { text-align: center; padding-top: 40px; }
        .logo-mark {
            width: 64px; height: 64px; border-radius: 20px;
            background: linear-gradient(145deg, #1e3550, #15273d);
            margin: 0 auto 28px; display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 700; color: #c9b07d; letter-spacing: -1px;
        }
        .welcome-title { font-size: 26px; font-weight: 600; color: #f0f3f8; letter-spacing: -0.3px; margin-bottom: 14px; line-height: 1.3; }
        .welcome-sub { font-size: 15px; color: #8a9bb5; line-height: 1.6; margin-bottom: 8px; padding: 0 10px; }
        .welcome-hint { font-size: 13px; color: #6b7d94; margin-bottom: 36px; }

        /* Экран 3: Форма лица */
        .shape-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
        .shape-card {
            background: rgba(20, 30, 48, 0.6); border: 1px solid rgba(100, 120, 150, 0.2);
            border-radius: 16px; padding: 16px 12px; text-align: center; cursor: pointer; transition: all 0.2s;
        }
        .shape-card:active, .shape-card.selected { border-color: #c9b07d; background: rgba(180, 160, 120, 0.08); }
        .shape-icon {
            width: 80px; height: 80px; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center;
        }
        .shape-label { font-size: 13px; font-weight: 500; color: #bcc6d4; }

        /* Экран 4: Цвет (локоны) */
        .color-row { display: flex; gap: 14px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
        .color-item {
            display: flex; flex-direction: column; align-items: center; cursor: pointer; gap: 6px;
        }
        .wig-swatch {
            width: 48px; height: 80px; border-radius: 12px; border: 2px solid transparent;
            transition: all 0.2s; overflow: hidden; position: relative;
        }
        .wig-swatch.selected { border-color: #c9b07d; transform: scale(1.08); box-shadow: 0 0 16px rgba(180, 160, 120, 0.25); }
        .color-label { font-size: 11px; color: #8a9bb5; text-align: center; }
        <!-- ЭКРАН 5: Стиль -->
        <div class="screen" id="screenStyle">
            <div class="section-header"><p class="section-title">Choose style</p></div>
            <div class="style-scroll" id="styleGrid">
                <!-- Pixie -->
                <div class="style-card" onclick="selectStyle(this, 'Pixie')">
                    <div class="style-icon">
                        <svg width="60" height="70" viewBox="0 0 80 100">
                            <ellipse cx="40" cy="45" rx="20" ry="24" fill="none" stroke="#c9b07d" stroke-width="2"/>
                            <path d="M22 38 Q20 18 40 15 Q60 18 58 38 Q54 32 40 30 Q26 32 22 38Z" fill="none" stroke="#c9b07d" stroke-width="2.5"/>
                            <path d="M18 43 Q15 45 18 49" fill="none" stroke="#c9b07d" stroke-width="1.5"/>
                            <path d="M62 43 Q65 45 62 49" fill="none" stroke="#c9b07d" stroke-width="1.5"/>
                        </svg>
                    </div>
                    <span class="style-label">Pixie</span>
                </div>
                <!-- Bob -->
                <div class="style-card" onclick="selectStyle(this, 'Bob')">
                    <div class="style-icon">
                        <svg width="60" height="70" viewBox="0 0 80 100">
                            <ellipse cx="40" cy="45" rx="20" ry="24" fill="none" stroke="#c9b07d" stroke-width="2"/>
                            <path d="M22 36 Q20 18 40 15 Q60 18 58 36 L58 62 Q58 66 54 66 L26 66 Q22 66 22 62Z" fill="none" stroke="#c9b07d" stroke-width="2.5"/>
                            <line x1="40" y1="15" x2="40" y2="62" stroke="#c9b07d" stroke-width="1" opacity="0.5"/>
                        </svg>
                    </div>
                    <span class="style-label">Bob</span>
                </div>
                <!-- Long Layers -->
                <div class="style-card" onclick="selectStyle(this, 'Long Layers')">
                    <div class="style-icon">
                        <svg width="60" height="70" viewBox="0 0 80 100">
                            <ellipse cx="40" cy="45" rx="20" ry="24" fill="none" stroke="#c9b07d" stroke-width="2"/>
                            <path d="M22 36 Q20 18 40 15 Q60 18 58 36 Q60 50 56 62 Q52 78 40 82 Q28 78 24 62 Q20 50 22 36Z" fill="none" stroke="#c9b07d" stroke-width="2.5"/>
                            <path d="M30 55 Q35 50 40 55 Q45 50 50 55" fill="none" stroke="#c9b07d" stroke-width="1.5"/>
                            <path d="M28 65 Q35 58 40 65 Q45 58 52 65" fill="none" stroke="#c9b07d" stroke-width="1.5"/>
                        </svg>
                    </div>
                    <span class="style-label">Long Layers</span>
                </div>
                <!-- Curly -->
                <div class="style-card" onclick="selectStyle(this, 'Curly')">
                    <div class="style-icon">
                        <svg width="60" height="70" viewBox="0 0 80 100">
                            <ellipse cx="40" cy="45" rx="20" ry="24" fill="none" stroke="#c9b07d" stroke-width="2"/>
                            <path d="M20 36 Q16 20 40 16 Q64 20 60 36 Q62 50 58 62 Q54 76 40 80 Q26 76 22 62 Q18 50 20 36Z" fill="none" stroke="#c9b07d" stroke-width="2.5"/>
                            <circle cx="28" cy="40" r="6" fill="none" stroke="#c9b07d" stroke-width="1.5"/>
                            <circle cx="52" cy="40" r="6" fill="none" stroke="#c9b07d" stroke-width="1.5"/>
                            <circle cx="40" cy="55" r="6" fill="none" stroke="#c9b07d" stroke-width="1.5"/>
                        </svg>
                    </div>
                    <span class="style-label">Curly</span>
                </div>
                <!-- Side Part -->
                <div class="style-card" onclick="selectStyle(this, 'Side Part')">
                    <div class="style-icon">
                        <svg width="60" height="70" viewBox="0 0 80 100">
                            <ellipse cx="40" cy="45" rx="20" ry="24" fill="none" stroke="#c9b07d" stroke-width="2"/>
                            <path d="M28 18 L28 62 Q28 66 32 66 L56 66 Q60 66 60 62 Q62 50 58 36 Q60 18 40 15 Q32 16 28 18Z" fill="none" stroke="#c9b07d" stroke-width="2.5"/>
                            <path d="M30 46 Q36 42 42 44" fill="none" stroke="#c9b07d" stroke-width="1.5"/>
                        </svg>
                    </div>
                    <span class="style-label">Side Part</span>
                </div>
                <!-- Soft Waves -->
                <div class="style-card" onclick="selectStyle(this, 'Soft Waves')">
                    <div class="style-icon">
                        <svg width="60" height="70" viewBox="0 0 80 100">
                            <ellipse cx="40" cy="45" rx="20" ry="24" fill="none" stroke="#c9b07d" stroke-width="2"/>
                            <path d="M22 36 Q20 18 40 15 Q60 18 58 36 Q60 50 56 62 Q52 78 40 82 Q28 78 24 62 Q20 50 22 36Z" fill="none" stroke="#c9b07d" stroke-width="2.5"/>
                            <path d="M26 52 Q33 46 40 52 Q47 46 54 52" fill="none" stroke="#c9b07d" stroke-width="1.8"/>
                            <path d="M26 62 Q33 56 40 62 Q47 56 54 62" fill="none" stroke="#c9b07d" stroke-width="1.8"/>
                            <path d="M28 70 Q34 65 40 70 Q46 65 52 70" fill="none" stroke="#c9b07d" stroke-width="1.8"/>
                        </svg>
                    </div>
                    <span class="style-label">Soft Waves</span>
                </div>
            </div>
            <p id="selectedStyleText" style="text-align:center; color:#c9b07d; font-size:13px;"></p>
            <div class="nav-buttons">
                <button class="btn-secondary" onclick="goTo('screenColor')">Back</button>
                <button class="btn-primary" style="max-width:160px;" onclick="goTo('screenPhoto')">Next</button>
            </div>
        </div>

        <!-- ЭКРАН 6: Фото + Результат -->
        <div class="screen" id="screenPhoto">
            <div class="section-header">
                <p class="section-title">Your new look</p>
                <p id="chosenInfo"></p>
            </div>
            <input type="file" id="photoInput" accept="image/*" capture="user" style="display: none;">
            <div class="upload-area" onclick="document.getElementById('photoInput').click()">
                <div class="upload-icon-inner">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </div>
                <p class="upload-title">Upload selfie</p>
                <p class="upload-hint">Take a selfie in natural light.<br>We'll help you visualize how a medical wig would look on you.</p>
            </div>
            <div id="resultBlock">
                <p class="result-label">Your new look</p>
                <img id="resultImg" src="" alt="Result">
                <button class="btn-primary" onclick="goTo('screenTip')" style="margin-top:8px;">Continue</button>
            </div>
        </div>

        <!-- ЭКРАН 7: Подсказка по поиску -->
        <div class="screen" id="screenTip">
            <div class="section-header"><p class="section-title">How to find this wig</p></div>
            <div class="info-box">
                <h4>Good to know</h4>
                <p>Wig colors are named differently in every catalog. Don't worry! Just show this image to your consultant. They'll understand exactly what you're looking for.</p>
            </div>
            <div class="nav-buttons">
                <button class="btn-secondary" onclick="goTo('screenPhoto')">Back</button>
                <button class="btn-primary" style="max-width:160px;" onclick="goTo('screenPricing')">Next</button>
            </div>
        </div>

        <!-- ЭКРАН 8: Пакеты -->
        <div class="screen" id="screenPricing">
            <div class="section-header"><p class="section-title">Try more looks</p></div>
            <p class="package-note">Your first try-on is free. If you'd like to explore more styles, choose a package that fits your needs.</p>
            <div class="package-card" onclick="alert('Payment: 99 Stars')">
                <p class="package-name">3 try-ons</p>
                <p class="package-price">99 ⭐</p>
                <p class="package-desc">~4 BYN</p>
            </div>
            <div class="package-card" onclick="alert('Payment: 249 Stars')">
                <p class="package-name">10 try-ons</p>
                <p class="package-price">249 ⭐</p>
                <p class="package-desc">~10 BYN</p>
            </div>
            <div class="nav-buttons">
                <button class="btn-secondary" onclick="goTo('screenTip')">Back</button>
            </div>
        </div>

        <!-- ФУТЕР -->
        <div class="footer">Designed for medical wig shopping. Made with care.</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let selectedColor = null;
        let selectedStyle = null;

        function goTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if (screenId === 'screenPhoto') {
                document.getElementById('chosenInfo').innerText = 
                    (selectedColor ? selectedColor : '') + (selectedStyle ? ' + ' + selectedStyle : '');
            }
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function selectShape(el, shape) {
            document.querySelectorAll('#shapeGrid .shape-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function selectColor(el, color) {
            document.querySelectorAll('#colorGrid .wig-swatch').forEach(c => c.classList.remove('selected'));
            el.querySelector('.wig-swatch').classList.add('selected');
            selectedColor = color;
            document.getElementById('selectedColorText').innerText = 'Selected: ' + color;
        }

        function selectStyle(el, style) {
            document.querySelectorAll('#styleGrid .style-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            selectedStyle = style;
            document.getElementById('selectedStyleText').innerText = 'Selected: ' + style;
        }

        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('resultImg').src = event.target.result;
                document.getElementById('resultBlock').style.display = 'block';
                document.getElementById('resultBlock').scrollIntoView({behavior: 'smooth'});
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
