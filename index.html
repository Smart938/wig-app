<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Примерка париков</title>
</head>
<body style="background:#1a1a1a; color:white; font-family:sans-serif; text-align:center; padding:20px;">
    <h1>✨ AI Примерка париков</h1>
    <p>Загрузи фото и смотри, как на тебе сидит любой парик!</p>
    <button style="background:gold; color:black; border:none; padding:15px 30px; font-size:18px; border-radius:10px;">
        📸 Загрузить фото
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
    </script>
</body>
</html>
