<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>WigTry</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0f1a;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #e8edf2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 16px 20px;
        }

        .container { 
            max-width: 420px; 
            width: 100%; 
        }

        /* Hero-секция с фото */
        .hero {
            position: relative;
            width: 100%;
            height: 260px;
            border-radius: 28px;
            overflow: hidden;
            margin: 24px 0 28px;
            background: #0d1225;
        }
        
        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }
        
        .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(10,15,26,0.95) 0%, transparent 100%);
        }
        
        .hero-text {
            position: absolute;
            bottom: 24px;
            left: 24px;
        }
        
        .hero-text h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }
        
        .hero-text p {
            font-size: 13px;
            color: #7eb8c9;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Секция выбора стиля */
        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #4a6070;
            margin-bottom: 14px;
            font-weight: 600;
        }

        .wig-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 2px 0 24px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .wig-card {
            min-width: 82px;
            height: 110px;
            background: rgba(20, 28, 45, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid rgba(70, 100, 120, 0.3);
            transition: all 0.25s;
            cursor: pointer;
            flex-shrink: 0;
        }

        .wig-card:active, .wig-card.active {
            border-color: #2eccd0;
            background: rgba(46, 204, 208, 0.08);
            box-shadow: 0 0 20px rgba(46, 204, 208, 0.1);
            transform: translateY(-2px);
        }

        .wig-card img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
        }
        
        .wig-label {
            font-size: 12px;
            font-weight: 500;
            color: #9aafc0;
            letter-spacing: 0.3px;
        }

        /* Зона загрузки */
        .upload-area {
            background: rgba(20, 28, 45, 0.5);
            border: 1.5px dashed rgba(46, 204, 208, 0.25);
            border-radius: 22px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin: 6px 0 20px;
        }
        .upload-area:active {
            border-color: #2eccd0;
            background: rgba(46, 204, 208, 0.05);
        }
        
        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: rgba(46, 204, 208, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .upload-icon svg {
            width: 22px;
            height: 22px;
            stroke: #2eccd0;
        }
        
        .upload-title {
            font-size: 15px;
            font-weight: 500;
            color: #d0dae5;
        }
        .upload-hint {
            font-size: 12px;
            color: #556877;
            margin-top: 4px;
        }

        /* Результат */
        #resultBlock {
            display: none;
            margin-top: 16px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        #resultBlock img {
            width: 100%;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 16px;
        }
        
        .result-label {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 14px;
            color: #b8d0db;
        }

        /* Кнопка */
        .btn-primary {
            background: linear-gradient(135deg, #1a3b45, #1a5060);
            color: #e0f0f5;
            border: 1px solid rgba(46, 204, 208, 0.3);
            padding: 15px 30px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 16px;
            width: 100%;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            margin-top: 6px;
        }
        .btn-primary:active {
            background: #1a5060;
            border-color: #2eccd0;
            transform: scale(0.97);
        }

        /* Статус */
        #statusText {
            text-align: center;
            color: #5e8a99;
            font-size: 13px;
            min-height: 20px;
            margin: 8px 0;
        }

        /* Подвал */
        .footer {
            margin-top: auto;
            padding: 30px 0 12px;
            font-size: 11px;
            color: #2a3a48;
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Hero -->
        <div class="hero">
            <img class="hero-img" src="https://images.unsplash.com/photo-1531746020798-e6953c6e8a04?w=600&h=400&fit=crop&crop=face" alt="Wig Try">
            <div class="hero-overlay"></div>
            <div class="hero-text">
                <h1>WigTry</h1>
                <p>Virtual fitting room</p>
            </div>
        </div>

        <!-- Выбор стиля -->
        <p class="section-label">Select style</p>
        <div class="wig-scroll" id="wigGrid">
            <div class="wig-card active" onclick="selectWig(this, 'Blonde')">
                <img src="https://images.unsplash.com/photo-1521146764736-56c929d59c83?w=100&h=100&fit=crop" alt="Blonde">
                <span class="wig-label">Blonde</span>
            </div>
            <div class="wig-card" onclick="selectWig(this, 'Brunette')">
                <img src="https://images.unsplash.com/photo-1541271696563-3be2f402496c?w=100&h=100&fit=crop" alt="Brunette">
                <span class="wig-label">Brunette</span>
            </div>
            <div class="wig-card" onclick="selectWig(this, 'Red')">
                <img src="https://images.unsplash.com/photo-1577774438656-27a3c3567f39?w=100&h=100&fit=crop" alt="Red">
                <span class="wig-label">Auburn</span>
            </div>
            <div class="wig-card" onclick="selectWig(this, 'Bob')">
                <img src="https://images.unsplash.com/photo-1601412436009-d964bd02edbc?w=100&h=100&fit=crop" alt="Bob">
                <span class="wig-label">Bob</span>
            </div>
            <div class="wig-card" onclick="selectWig(this, 'Curly')">
                <img src="https://images.unsplash.com/photo-1620336655052-0fd4fd6e0a19?w=100&h=100&fit=crop" alt="Curly">
                <span class="wig-label">Curly</span>
            </div>
        </div>

        <!-- Загрузка -->
        <input type="file" id="photoInput" accept="image/*" capture="user" style="display: none;">
        <div class="upload-area" onclick="document.getElementById('photoInput').click()">
            <div class="upload-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
            </div>
            <p class="upload-title">Upload selfie</p>
            <p class="upload-hint">Tap to select photo</p>
        </div>
        <p id="statusText"></p>

        <!-- Результат -->
        <div id="resultBlock">
            <p class="result-label">Your new look</p>
            <img id="resultImg" src="" alt="Result">
            <button class="btn-primary" onclick="alert('Payment coming soon')">Save Look</button>
        </div>

        <div class="footer">Private & secure &middot; Photos are not stored</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let selectedWig = 'Blonde';

        function selectWig(cardElement, wigName) {
            document.querySelectorAll('.wig-card').forEach(c => c.classList.remove('active'));
            cardElement.classList.add('active');
            selectedWig = wigName;
            document.getElementById('statusText').innerText = 'Style: ' + wigName;
        }

        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = document.getElementById('resultImg');
                img.src = event.target.result;
                document.getElementById('resultBlock').style.display = 'block';
                document.getElementById('statusText').innerText = 'Ready! Style: ' + selectedWig;
                document.getElementById('resultBlock').scrollIntoView({behavior: 'smooth'});
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
