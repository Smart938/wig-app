<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>WigTry | Примерка париков</title>
    <style>
        /* Стильный современный дизайн */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f0e6d3;
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { 
            max-width: 400px; 
            width: 100%; 
        }

        /* Заголовок */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 42px;
            margin-bottom: 8px;
            display: block;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(135deg, #e8c284, #c9956b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: #8a8070;
            font-size: 14px;
            margin-top: 6px;
            font-style: italic;
        }

        /* Карточка выбора парика */
        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8a8070;
            margin-bottom: 12px;
            text-align: center;
        }

        .wig-grid {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 4px 0 20px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .wig-card {
            min-width: 85px;
            height: 100px;
            background: #1a1a1a;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1.5px solid #2a2a2a;
            transition: all 0.2s;
            cursor: pointer;
            flex-shrink: 0;
        }

        .wig-card:active, .wig-card.active {
            border-color: #e8c284;
            background: #1e1a14;
            transform: scale(0.96);
        }

        .wig-emoji { font-size: 30px; }
        .wig-label { font-size: 12px; font-weight: 500; }

        /* Зона фото */
        .photo-area {
            background: #111111;
            border: 2px dashed #2a2a2a;
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            margin: 10px 0 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .photo-area:active { border-color: #e8c284; background: #151515; }
        
        .photo-icon {
            font-size: 48px;
            margin-bottom: 8px;
            display: block;
        }
        .photo-text { font-size: 16px; font-weight: 500; color: #ccc; }
        .photo-hint { font-size: 13px; color: #666; margin-top: 4px; }

        /* Результат */
        #resultBlock {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
        #resultBlock img {
            width: 100%;
            border-radius: 20px;
            border: 2px solid #2a2a2a;
            margin-bottom: 16px;
        }
        .result-label {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 12px;
            color: #e8c284;
        }

        /* Кнопка оплаты */
        .btn-gold {
            background: linear-gradient(135deg, #e8c284, #b8863c);
            color: #0a0a0a;
            border: none;
            padding: 16px 32px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 16px;
            width: 100%;
            cursor: pointer;
            letter-spacing: -0.2px;
            transition: 0.2s;
            margin-top: 8px;
        }
        .btn-gold:active { transform: scale(0.97); opacity: 0.9; }

        /* Подвал */
        .footer {
            margin-top: auto;
            padding: 30px 0 10px;
            font-size: 12px;
            color: #444;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <span class="logo">✨</span>
            <h1>WigTry</h1>
            <p class="subtitle">виртуальная примерка париков</p>
        </div>

        <!-- Выбор парика -->
        <p class="section-title">Выбери стиль</p>
        <div class="wig-grid" id="wigGrid">
            <div class="wig-card active" onclick="selectWig(this, 'Блонд')">
                <span class="wig-emoji">👱‍♀️</span>
                <span class="wig-label">Блонд</span>
            </div>
            <div class="wig-card" onclick="selectWig(this, 'Брюнет')">
                <span class="wig-emoji">👩</span>
                <span class="wig-label">Брюнет</span>
            </div>
            <div class="wig-card" onclick="selectWig(this, 'Рыжий')">
                <span class="wig-emoji">🧑‍🦰</span>
                <span class="wig-label">Рыжий</span>
            </div>
            <div class="wig-card" onclick="selectWig(this, 'Каре')">
                <span class="wig-emoji">💇‍♀️</span>
                <span class="wig-label">Каре</span>
            </div>
            <div class="wig-card" onclick="selectWig(this, 'Кудри')">
                <span class="wig-emoji">👩‍🦱</span>
                <span class="wig-label">Кудри</span>
            </div>
        </div>

        <!-- Загрузка фото -->
        <input type="file" id="photoInput" accept="image/*" capture="user" style="display: none;">
        <div class="photo-area" onclick="document.getElementById('photoInput').click()">
            <span class="photo-icon">📸</span>
            <p class="photo-text">Загрузить селфи</p>
            <p class="photo-hint">нажми, чтобы выбрать фото</p>
        </div>
        <p id="statusText" style="text-align:center; color:#e8c284; font-size:14px; min-height:20px;"></p>

        <!-- Результат -->
        <div id="resultBlock">
            <p class="result-label">✨ Твой новый образ</p>
            <img id="resultImg" src="" alt="Результат примерки">
            <!-- Заглушка: позже будет оплата -->
            <button class="btn-gold" onclick="alert('Здесь будет оплата ⭐')">💫 Сохранить образ</button>
        </div>

        <div class="footer">
            конфиденциально • фото не сохраняются
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let selectedWig = 'Блонд'; // по умолчанию

        // Выбор парика
        function selectWig(cardElement, wigName) {
            document.querySelectorAll('.wig-card').forEach(c => c.classList.remove('active'));
            cardElement.classList.add('active');
            selectedWig = wigName;
            document.getElementById('statusText').innerText = 'Выбран стиль: ' + wigName;
        }

        // Загрузка фото
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = document.getElementById('resultImg');
                img.src = event.target.result;
                document.getElementById('resultBlock').style.display = 'block';
                document.getElementById('statusText').innerText = '🎉 Примерка готова! Стиль: ' + selectedWig;
                // Прокрутка вниз, чтобы показать результат
                document.getElementById('resultBlock').scrollIntoView({behavior: 'smooth'});
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
